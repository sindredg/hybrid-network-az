name: 'Terraform Deploy - Hybrid Network Azure Lab'

on:
  # 1. Gives us a manual "Run workflow" button in GitHub Actions
  workflow_dispatch:

  # 2. Automatically runs a safe "terraform plan" when you open a PR (no applies)
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**' # Only triggers if files inside the terraform folder change

# Required for OIDC Authentication with Azure
permissions:
  id-token: write
  contents: read

# One state blob, one run at a time. Shared group with the destroy workflow.
concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true
  TF_VAR_vpn_shared_key: ${{ secrets.VPN_SHARED_KEY }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
  TF_VAR_deploy_workloads: true

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0" # Use your preferred version

    - name: Terraform Init (Partial Backend Config)
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}"

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Plan
      run: terraform plan -out=tfplan

    # Must name an event that appears in the on: block above.
    - name: Terraform Apply
      if: github.event_name == 'workflow_dispatch'
      run: terraform apply -auto-approve tfplan